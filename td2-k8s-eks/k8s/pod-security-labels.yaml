# TD 2 - etape 4 : Pod Security Standards sur le namespace semishop
# Re-declaration COMPLETE du namespace : kubectl apply gere les labels par
# difference avec le dernier apply - ce fichier REPREND donc les labels de
# l'etape 2 et AJOUTE les labels Pod Security.
# Le namespace monitoring reste sans enforcement : node-exporter a besoin
# d'un acces hote (hostNetwork, /proc) que le niveau baseline interdit.
apiVersion: v1
kind: Namespace
metadata:
  name: semishop
  labels:
    app.kubernetes.io/part-of: semishop
    environment: poc
    # TODO-4.1 : le niveau IMPOSE a l'entree du namespace (bloque les pods
    #   privilegies sans interdire l'existant raisonnable)
    pod-security.kubernetes.io/enforce: a-completer
    # TODO-4.2 : le niveau sur lequel on veut etre AVERTI sans bloquer
    #   (le niveau le plus strict des Pod Security Standards)
    pod-security.kubernetes.io/warn: a-completer
